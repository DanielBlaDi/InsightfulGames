name: InsightfulGames

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:dev
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api-gateway-component
    networks:
      - app

  api-gateway-component:
    build:
      context: ./backend/api-gateway-component
      dockerfile: Dockerfile
    image: api-gateway-component:dev
    expose:
      - "${API_GATEWAY_PORT}"
    environment:
      PORT: "${API_GATEWAY_PORT}"
      AUTH_COMPONENT_URL: http://auth-component:${AUTH_PORT}
      SINGLE_PLAYER_COMPONENT_URL: http://single-player-component:${SINGLE_PLAYER_PORT}
      # MULTIPLAYER_COMPONENT_URL: http://multiplayer-component:${MULTIPLAYER_PORT}
      # TUTOR_COMPONENT_URL: http://tutor-component:${TUTOR_PORT}
      BOTSITO_COMPONENT_URL: http://botsito-component:${BOTSITO_PORT}
    depends_on:
      - auth-component
      - single-player-component
      # - multiplayer-component
      # - tutor-component
      - game-logic-component
      - botsito-component
    networks:
      - app

  auth-component:
    build:
      context: ./backend/auth-component
      dockerfile: Dockerfile
    image: auth-component:dev
    expose:
      - "${AUTH_PORT}"
    environment:
      SERVER_PORT: "${AUTH_PORT}"
      GATEWAY_URL: http://api-gateway-component:${API_GATEWAY_PORT}
      MYSQL_HOST: mysql
      MYSQL_PORT: "${MYSQL_PORT}"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - app

  game-logic-component:
    build:
      context: ./backend/game-logic-component
      dockerfile: Dockerfile
    image: game-logic-component:dev
    expose:
      - "${GAME_LOGIC_PORT}"
    environment:
      SERVER_PORT: "${GAME_LOGIC_PORT}"
      MONGO_HOST: mongo
      MONGO_PORT: "${MONGO_PORT}"
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DATABASE}
    depends_on:
      - mongo
    networks:
      - app

  single-player-component:
    build:
      context: ./backend/single-player-component
      dockerfile: Dockerfile
    image: single-player-component:dev
    expose:
      - "${SINGLE_PLAYER_PORT}"
    environment:
      PORT: "${SINGLE_PLAYER_PORT}"
      GATEWAY_URL: http://api-gateway-component:${API_GATEWAY_PORT}
      GAME_LOGIC_COMPONENT_URL: http://game-logic-component:${GAME_LOGIC_PORT}
    depends_on:
      - game-logic-component
    networks:
      - app

  # multiplayer-component:
  #   build:
  #     context: ./backend/multiplayer-component
  #     dockerfile: Dockerfile
  #   image: multiplayer-component:dev
  #   expose:
  #     - "${MULTIPLAYER_PORT}"
  #   environment:
  #     SERVER_PORT: "${MULTIPLAYER_PORT}"
  #     GATEWAY_URL: http://api-gateway-component:${API_GATEWAY_PORT}
  #     GAME_LOGIC_COMPONENT_URL: http://game-logic-component:${GAME_LOGIC_PORT}
  #   depends_on:
  #     - game-logic-component
  #   networks:
  #     - app

  # tutor-component:
  #   build:
  #     context: ./backend/tutor-component
  #     dockerfile: Dockerfile
  #   image: tutor-component:dev
  #   expose:
  #     - "${TUTOR_PORT}"
  #   environment:
  #     PORT: "${TUTOR_PORT}"
  #     GATEWAY_URL: http://api-gateway-component:${API_GATEWAY_PORT}
  #     REDIS_HOST: redis
  #     REDIS_PORT: "${REDIS_PORT}"
  #     REDIS_PASSWORD: ${REDIS_PASSWORD}
  #   depends_on:
  #     - redis
  #   networks:
  #     - app

  botsito-component:
    build:
      context: ./backend/botsito-component
      dockerfile: Dockerfile
    image: botsito-component:dev
    expose:
      - "${BOTSITO_PORT}"
    environment:
      PORT: "${BOTSITO_PORT}"
      GATEWAY_URL: http://api-gateway-component:${API_GATEWAY_PORT}
    networks:
      - app

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "${REDIS_PORT}"
    volumes:
      - redis-data:/data
    networks:
      - app

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

      MONGO_APP_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_USER}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    expose:
      - "${MONGO_PORT}"
    volumes:
      - mongo-data:/data/db
      - ./databases/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app
      
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "${MYSQL_PORT}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app

networks:
  app:

volumes:
  redis-data:
  mongo-data:
  mysql-data:   