  mongo:
    image: mongo:7
    container_name: mongo-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

      MONGO_APP_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_USER}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    expose:
      - "${MONGO_PORT}"
    volumes:
      - mongo-data:/data/db
      - ./databases/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app
      



  mysql:
    image: mysql:8.4
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "${MYSQL_PORT}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./databases/auth/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app



networks:
  app:



volumes:
  redis-data:
  mongo-data:
  mysql-data:   