name: InsightfulGames

x-service: &service
  restart: unless-stopped
  networks:
    - app

services:


# presetacion----------------------------------------------------------------------------------------------------------------------------

  frontend:
    <<: *service
    # profiles: ["pendiente"]
    container_name: frontend-component
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: frontend:dev
    ports:
      - "${FRONTEND_PORT:?}:80"
    environment:
      API_GATEWAY_URL: http://api-gateway-component:8080
    depends_on:
      api-gateway-component:
        condition: service_healthy


# apis gateway

# bff

  api-gateway-mobile:
    <<: *service
    container_name: api-gateway-mobile
    build:
      context: ./Backend/api-gateway-mobile
      dockerfile: Dockerfile
    image: api-gateway-mobile:dev
    ports:
      - "${MOBILE_GATEWAY_PORT:?}:8090"
    environment:
      PORT: "8090"
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ALGORITHM: ${JWT_ALGORITHM:?}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}

# api gateway

  api-gateway-component:
    <<: *service
    ports:
      - "127.0.0.1:8080:8080"
        # <--- for testing with curl

    container_name: api-gateway-component
    build:
      context: ./Backend/api-gateway
      dockerfile: Dockerfile
    image: api-gateway-component:dev
    expose:
      - "8080"
    environment:
      PORT: "8080"
      AUTH_URL: http://auth-component:8081
      GAME_LOGIC_URL: http://game-logic-component:8082
      SINGLE_PLAYER_URL: http://single-player-component:8083
      MULTIPLAYER_URL: http://multiplayer-component:8084
      TUTOR_URL: http://tutor-component:8085
      BOTCITO_URL: http://botcito-component:8086
      PROFILE_URL: http://profile-stats-component:8087
      BOTCITO_ANALYSIS_URL: http://botcito-analysis-component:8091
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ALGORITHM: ${JWT_ALGORITHM:?}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
      COOKIE_SECURE: ${COOKIE_SECURE:?}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?}
      CORS_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


    depends_on:
      - auth-component
      - profile-stats-component
      - single-player-component
      - multiplayer-component
      - tutor-component
      - game-logic-component
      - botcito-component
      - botcito-analysis-component


# logica ------------------------------------------

  auth-component:
    <<: *service
    ports:
    - "8081:8081" #  <--- for testing with curl
    container_name: auth-component
    build:
      context: ./Backend/auth-component
      dockerfile: Dockerfile
    image: auth-component:dev
    expose:
      - "8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?}
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:?}

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  game-logic-component:
    <<: *service
    ports:
      - "8082:8082" #  <--- for testing with curl
    container_name: game-logic-component
    build:
      context: ./Backend/GameLogic
      dockerfile: Dockerfile
    image: game-logic-component:dev
    expose:
      - "8082"
    environment:
      SERVER_PORT: "8082"
      MONGO_URL: mongodb://${MONGO_USER:?}:${MONGO_PASSWORD:?}@mongo:27017/${MONGO_DATABASE:?}?authSource=${MONGO_DATABASE:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      WAITING_TIMEOUT_MINUTES: ${WAITING_TIMEOUT_MINUTES:?}
    healthcheck:
      # La imagen eclipse-temurin JRE no trae curl ni wget: bash abre el socket directamente.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  single-player-component:
    <<: *service
    ports:
      - "8083:8083" # <--- for testing with curl
    container_name: single-player-component
    build:
      context: ./Backend/GameService
      dockerfile: Dockerfile
    image: single-player-component:dev
    expose:
      - "8083"
    environment:
      SERVER_PORT: "8083"
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy


  multiplayer-component:
    <<: *service
    # profiles: ["pendiente"]
    ports:
      - "8084:8084"
    container_name: multiplayer-component
    restart: unless-stopped
    build:
      context: ./Backend/multiplayer-component
      dockerfile: Dockerfile
    image: multiplayer-component:dev
    expose:
      - "8084"
    environment:
      SERVER_PORT: "8084"
      PORT: "8084"
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      RECONNECT_WINDOW_SECONDS: ${RECONNECT_WINDOW_SECONDS:?}
      LOG_LEVEL: ${LOG_LEVEL:?}


  tutor-component:
    <<: *service
    ports:
      - "8085:8085"
    container_name: tutor-component
    build:
      context: ./Backend/tutor-component
      dockerfile: Dockerfile
    image: tutor-component:dev
    expose:
      - "8085"
    environment:
      PORT: "8085"
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      MONGO_ANALYSIS_URL: mongodb://${MONGO_ANALYSIS_USER:?}:${MONGO_ANALYSIS_PASSWORD:?}@mongo-analysis:27017/${MONGO_ANALYSIS_DATABASE:?}?authSource=${MONGO_ANALYSIS_DATABASE:?}
      MONGO_ANALYSIS_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      ENGINE_VERSION: ${ENGINE_VERSION:?}
      ANALYSIS_DEPTH_DEFAULT: ${ANALYSIS_DEPTH_DEFAULT:?}
      ANALYSIS_DEPTH_MAX: ${ANALYSIS_DEPTH_MAX:?}
      ANALYSIS_MAX_REACTIVATIONS: ${ANALYSIS_MAX_REACTIVATIONS:?}
      LLM_PROVIDER: ${LLM_PROVIDER:?}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    depends_on:
      mongo-analysis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  
  botcito-component:
    <<: *service
    ports:
      - "8086:8086" # <--- for testing with curl
    container_name: botcito-component
    build:
      context: ./Backend/botcito-component
      dockerfile: Dockerfile
    image: botcito-component:dev
    expose:
      - "8086"
    environment:
      PORT: "8086"
      ENGINE_ROLE: game
      STOCKFISH_PATH: /usr/games/stockfish
      ENGINE_POOL_SIZE: "2"
      ENGINE_THREADS: "1"
      ENGINE_TIMEOUT_MS: "2000"
      LOG_LEVEL: ${LOG_LEVEL:?}


  botcito-analysis-component:
    <<: *service
    # profiles: ["pendiente"]
    container_name: botcito-analysis-component
    build:
      context: ./Backend/botcito-component
      dockerfile: Dockerfile
    image: botcito-component:dev
    expose:
      - "8091"
    environment:
      PORT: "8091"
      ENGINE_ROLE: analysis
      STOCKFISH_PATH: /usr/games/stockfish
      ENGINE_POOL_SIZE: "2"
      ENGINE_THREADS: "1"
      ENGINE_TIMEOUT_MS: "10000"
      ANALYSIS_DEPTH_MAX: ${ANALYSIS_DEPTH_MAX:?}
      LOG_LEVEL: ${LOG_LEVEL:?}

  profile-stats-component:
    <<: *service
    container_name: profile-stats-component
    build:
      context: ./Backend/profile-stats-component
      dockerfile: Dockerfile
    image: profile-stats-component:dev
    expose:
      - "8087"
    environment:
      SERVER_PORT: "8087"
      POSTGRES_URL: jdbc:postgresql://postgres-profile:5432/${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
    depends_on:
      postgres-profile:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

# workers ------------------------------------------------------------------------------------------------

  timeout-worker:
    <<: *service
    # profiles: ["pendiente"]
    container_name: timeout-worker
    build:
      context: ./Backend/timeout-worker
      dockerfile: Dockerfile
    image: timeout-worker:dev
    expose:
      - "8088"
    environment:
      PORT: "8088"
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      TIMEOUT_POLL_INTERVAL_SECONDS: ${TIMEOUT_POLL_INTERVAL_SECONDS:?}
      TIMEOUT_BATCH_LIMIT: ${TIMEOUT_BATCH_LIMIT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    healthcheck:
      test: ["CMD", "/app/timeout-worker", "-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api-gateway-component:
        condition: service_healthy



  analysis-worker:
    <<: *service
    # profiles: ["pendiente"]
    container_name: analysis-worker
    build:
      context: ./Backend/analysis-worker
      dockerfile: Dockerfile
    image: analysis-worker:dev
    expose:
      - "8089"
    environment:
      PORT: "8089"
      GATEWAY_INTERNAL_URL: http://api-gateway-component:8080
      MONGO_ANALYSIS_URL: mongodb://${MONGO_ANALYSIS_USER:?}:${MONGO_ANALYSIS_PASSWORD:?}@mongo-analysis:27017/${MONGO_ANALYSIS_DATABASE:?}?authSource=${MONGO_ANALYSIS_DATABASE:?}
      MONGO_ANALYSIS_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      ANALYSIS_DEPTH_MAX: ${ANALYSIS_DEPTH_MAX:?}
      ANALYSIS_MAX_RETRIES: ${ANALYSIS_MAX_RETRIES:?}
      ANALYSIS_INACCURACY_CP: ${ANALYSIS_INACCURACY_CP:?}
      ANALYSIS_MISTAKE_CP: ${ANALYSIS_MISTAKE_CP:?}
      ANALYSIS_BLUNDER_CP: ${ANALYSIS_BLUNDER_CP:?}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:?}
      ANALYSIS_STALE_MINUTES: ${ANALYSIS_STALE_MINUTES:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    depends_on:
      mongo-analysis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy



# Bases de datos

  mongo:
    <<: *service
    image: mongo:7
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?}
      MONGO_APP_DATABASE: ${MONGO_DATABASE:?}
      MONGO_APP_USERNAME: ${MONGO_USER:?}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
      - type: bind
        source: ./Databases/mongo/init-mongo.sh
        target: /docker-entrypoint-initdb.d/init-mongo.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  mongo-analysis:
    <<: *service
    image: mongo:7
    container_name: mongo-analysis-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      MONGO_APP_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      MONGO_APP_USERNAME: ${MONGO_ANALYSIS_USER:?}
      MONGO_APP_PASSWORD: ${MONGO_ANALYSIS_PASSWORD:?}
    expose:
      - "27017"
    volumes:
      - mongo-analysis-data:/data/db
      - type: bind
        source: ./Databases/mongo/init-mongo.sh
        target: /docker-entrypoint-initdb.d/init-mongo.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: 
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s



  mysql:
    <<: *service
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./Databases/auth/01-init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-profile:
    <<: *service
    image: postgres:16-alpine
    container_name: postgres-profile-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./Databases/profile/01-init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  rabbitmq:
    <<: *service
    image: rabbitmq:3.13-management
    container_name: rabbitmq-broker
    # Nombre fijo: RabbitMQ guarda sus datos en un directorio derivado del nombre del nodo.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

networks:
  app:

volumes:
  mongo-data:
  mongo-analysis-data:
  mysql-data:
  postgres-data:
  rabbitmq-data: