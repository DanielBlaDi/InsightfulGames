name: InsightfulGames

services:
  frontend:
    container_name: fronted-component
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:dev
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      API_GATEWAY_URL: http://api-gateway-component:8080
    networks:
      - app



  api-gateway-component:

    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
        # <--- for testing with curl

    container_name: api-gateway-component
    restart: unless-stopped
    build:
      context: ./Backend/api-gateway
      dockerfile: Dockerfile
    image: api-gateway-component:dev
    expose:
      - "${API_GATEWAY_PORT}"
    environment:
      PORT: "${API_GATEWAY_PORT}"

      USE_MOCK: "False"
      # <--- for testing with curl

      AUTH_URL: http://auth-component:${AUTH_PORT}
      SINGLE_PLAYER_URL: http://single-player-component:${SINGLE_PLAYER_PORT}
      BOTSITO_COMPONENT_URL: http://botsito-component:${BOTSITO_PORT}
      HTTP_TIMEOUT: 15
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost:3000
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ALGORITHM: "${JWT_ALGORITHM}"

      # MULTIPLAYER_COMPONENT_URL: http://multiplayer-component:${MULTIPLAYER_PORT}
      # TUTOR_COMPONENT_URL: http://tutor-component:${TUTOR_PORT}
    depends_on:
      - auth-component
      - single-player-component
      # - multiplayer-component
      # - tutor-component
      - game-logic-component
      # - botsito-component
    networks:
      - app



  auth-component:
    ports:
    - "${AUTH_PORT}:${AUTH_PORT}" #  <--- for testing with curl

    container_name: auth-component
    restart: unless-stopped
    build:
      context: ./Backend/auth-component
      dockerfile: Dockerfile
    image: auth-component:dev
    expose:
      - "${AUTH_PORT}"
    environment:
      SERVER_PORT: "${AUTH_PORT}"

      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:${MYSQL_PORT}/${MYSQL_DATABASE}"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      JWT_SECRET: ${JWT_SECRET}

      GATEWAY_URL: http://api-gateway-component:${API_GATEWAY_PORT}
      
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app



  game-logic-component:
    ports:
      - "${GAME_LOGIC_PORT}:${GAME_LOGIC_PORT}" #  <--- for testing with curl


    container_name: game-logic-component
    restart: unless-stopped
    build:
      context: ./Backend/GameLogic
      dockerfile: Dockerfile
    image: game-logic-component:dev
    expose:
      - "${GAME_LOGIC_PORT}"
    environment:
      SERVER_PORT: "${GAME_LOGIC_PORT}"
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:${MONGO_PORT}/${MONGO_DATABASE}?authSource=${MONGO_DATABASE}"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app



  single-player-component:
    ports:
      - "${SINGLE_PLAYER_PORT}:${SINGLE_PLAYER_PORT}" # <--- for testing with curl


    container_name: single-player-component
    restart: unless-stopped
    build:
      context: ./Backend/GameService
      dockerfile: Dockerfile
    image: single-player-component:dev
    expose:
      - "${SINGLE_PLAYER_PORT}"
    environment:
      PORT: "${SINGLE_PLAYER_PORT}"
      GAME_LOGIC_URL: http://game-logic-component:${GAME_LOGIC_PORT}

      # El modo vs_bot llama a {GATEWAY_INTERNAL_URL}/engine/best-move.
      # Aquí apunta al Botcito falso que corre en tu máquina (GameService/tools/fake_botcito.py, puerto 8000).

      GATEWAY_INTERNAL_URL: http://host.docker.internal:8000 # el modo BOT necesita que Botcito exista  <--- for testing with curl
    extra_hosts:
      - "host.docker.internal:host-gateway" # necesario en Linux; en Windows y Mac ya existe    
    depends_on:
      - game-logic-component
    networks:
      - app



