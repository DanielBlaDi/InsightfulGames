name: insightfulgames

x-service: &service
  restart: unless-stopped

x-waf-tls-env: &waf-tls-env
  # Client -> WAF: TLS terminated here so ModSecurity/CRS can inspect the HTTP request
  SSL_PORT: "8443"
  SSL_CERT_FILE: /etc/nginx/edge-certs/tls.crt
  SSL_CERT_KEY_FILE: /etc/nginx/edge-certs/tls.key
  SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
  # Same ECDHE + AEAD list as backend/reverse-proxy/nginx/common.conf (the image default also allows DHE)
  SSL_CIPHERS: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
  SSL_OCSP_STAPLING: "off"             # development certificates have no OCSP responder
  # Plain HTTP is never proxied: 301 to HTTPS before ModSecurity or the reverse proxy see the request
  NGINX_ALWAYS_TLS_REDIRECT: "on"
  # WAF -> reverse proxy: new TLS connection, certificate chain AND name verified
  PROXY_SSL: "on"
  PROXY_SSL_VERIFY: "on"
  PROXY_SSL_VERIFY_DEPTH: "1"          # leaf signed directly by the internal CA
  PROXY_SSL_SERVER_NAME: "on"          # SNI; the name checked is the host of BACKEND
  PROXY_SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
  PROXY_SSL_CIPHERS: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
  PROXY_SSL_CA_CERT_FILE: /etc/nginx/upstream-ca/ca.crt   # ONLY the internal CA (not the system store)

x-edge-cert: &edge-cert
  type: bind
  source: ${EDGE_TLS_DIR:?}            # tls.crt + tls.key (mkcert: localhost, 127.0.0.1, ::1, 10.0.2.2)
  target: /etc/nginx/edge-certs
  read_only: true
  bind:
    create_host_path: false

x-internal-ca: &internal-ca
  type: bind
  source: ${INTERNAL_CA_CERT:?}        # certs/internal/ca/ca.crt (public certificate only, never ca.key)
  target: /etc/nginx/upstream-ca/ca.crt
  read_only: true
  bind:
    create_host_path: false

x-real-ip-conf: &real-ip-conf
  type: bind
  source: ./backend/waf/real-ip.conf
  target: /etc/nginx/conf.d/real-ip.conf
  read_only: true
  bind:
    create_host_path: false

services:
  waf-web:
    <<: *service
    image: owasp/modsecurity-crs:nginx
    container_name: waf-web
    environment:
      <<: *waf-tls-env
      BACKEND: "https://reverse-proxy-web:8443"
      PORT: "8080"
      SSL_REDIRECT_PORT: ${FRONTEND_HTTPS_PORT:?}   # public HTTPS port used in the 301
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      # Approved by the WAF owner: CRS default (GET HEAD POST OPTIONS) + PATCH and DELETE used by the web
      # gateway (DELETE /api/auth/account, PATCH /api/games|matches/{id}/visibility). Rule 911100 stays
      # active for any other method; paranoia level and anomaly thresholds unchanged.
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PATCH DELETE"
    ports:
      - "${FRONTEND_PORT:?}:8080"          # HTTP: only 301 to HTTPS
      - "${FRONTEND_HTTPS_PORT:?}:8443"    # HTTPS + WSS
    volumes:
      - *edge-cert
      - *internal-ca
    networks:
      public_network:
        ipv4_address: 10.20.1.13
    depends_on:
      reverse-proxy-web:
        condition: service_healthy

  waf-mobile:
    <<: *service
    image: owasp/modsecurity-crs:nginx
    container_name: waf-mobile
    environment:
      <<: *waf-tls-env
      BACKEND: "https://reverse-proxy-mobile:8443"
      PORT: "8080"
      SSL_REDIRECT_PORT: ${MOBILE_HTTPS_PORT:?}
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      # Approved by the WAF owner: CRS default + DELETE (DELETE /auth/account); the mobile gateway has no PATCH.
      ALLOWED_METHODS: "GET HEAD POST OPTIONS DELETE"
    ports:
      - "${MOBILE_HTTPS_PORT:?}:8443"      # HTTPS only: mobile HTTP is not published
    volumes:
      - *edge-cert
      - *internal-ca
    networks:
      public_network:
        ipv4_address: 10.20.1.14
    depends_on:
      reverse-proxy-mobile:
        condition: service_healthy

  # =============================================================================================
  # REVERSE PROXIES (PUBLIC SUBNETWORK 1 - 10.20.1.0/24) (PRIVATE SUBNETWORK 1 - 10.20.2.0/24)
  # Routing:
  #   - reverse-proxy-web (:8443 HTTPS/WSS)    -> frontend-component:80 and api-gateway-component:8080
  #                       (:8000 HTTP)         -> only /health and 308 redirect to HTTPS
  #   - reverse-proxy-mobile (:8443 HTTPS)     -> api-gateway-mobile:8090
  #                          (:8090 HTTP)      -> only /health (healthcheck), not published
  # Secure Channel Pattern (Prototype 3, scenario 1): the internal TLS channel ends here; see docs/secure-channel-tls.md.
  # Certificates are mounted read-only from the host (never baked into the image or committed).
  # =============================================================================================

  reverse-proxy-web:
    <<: *service
    container_name: reverse-proxy-web
    build:
      context: ./backend/reverse-proxy
      dockerfile: Dockerfile
      args:
        ENTRY: web            # nginx/common.conf + nginx/web.conf.template
        HEALTH_PORT: "8000"
    image: reverse-proxy-web:dev
    expose:
      - "8000"
      - "8443"
    environment:
      PUBLIC_HTTPS_PORT: ${FRONTEND_HTTPS_PORT:?}   # port used in the HTTP -> HTTPS redirect
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:?}
    volumes:
      - *real-ip-conf
      - type: bind
        source: ${INTERNAL_WEB_TLS_DIR:?}      # certs/internal/reverse-proxy-web (SAN reverse-proxy-web)
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    networks:
      public_network:
        ipv4_address: 10.20.1.11
      private_api:
        ipv4_address: 10.20.2.10
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway-component:
        condition: service_healthy

  reverse-proxy-mobile:
    <<: *service
    container_name: reverse-proxy-mobile
    build:
      context: ./backend/reverse-proxy
      dockerfile: Dockerfile
      args:
        ENTRY: mobile         # nginx/common.conf + nginx/mobile.conf.template
        HEALTH_PORT: "8090"
    image: reverse-proxy-mobile:dev
    expose:
      - "8090"
      - "8443"
    environment:
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:?}
    volumes:
      - *real-ip-conf
      - type: bind
        source: ${INTERNAL_MOBILE_TLS_DIR:?}   # certs/internal/reverse-proxy-mobile (SAN reverse-proxy-mobile)
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    networks:
      public_network:
        ipv4_address: 10.20.1.12
      private_api:
        ipv4_address: 10.20.2.11
    depends_on:
      api-gateway-mobile:
        condition: service_healthy

  # =============================================================================================
  # PRESENTATION (PRIVATE SUBNETWORK 1 - 10.20.2.0/24)
  # =============================================================================================
  frontend:
    <<: *service
    container_name: frontend-component
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:dev
    expose:
      - "80"
    environment:
      API_GATEWAY_URL: http://api-gateway-component:8080
    networks:
      private_api:
        ipv4_address: 10.20.2.12
    healthcheck:
      test: ["CMD", "node", "--input-type=commonjs", "-e", "require('http').get('http://127.0.0.1:80/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api-gateway-component:
        condition: service_healthy

  # =============================================================================================
  # API GATEWAYS (PRIVATE SUBNETWORK 1 - 10.20.2.0/24) (PRIVATE SUBNETWORK 2 - 10.20.3.0/24)
  # =============================================================================================
  api-gateway-mobile:
    <<: *service
    container_name: api-gateway-mobile
    build:
      context: ./backend
      dockerfile: api-gateway-mobile/Dockerfile
    image: api-gateway-mobile:dev
    expose:
      - "8090"
    environment:
      PORT: "8090"
      AUTH_URL: http://auth-component:8081
      GAME_LOGIC_URL: http://game-logic-component:8082
      PROFILE_URL: http://profile-stats-component:8087
      TUTOR_URL: http://tutor-component:8085
      SINGLE_PLAYER_URL: http://single-player-component:8083
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ALGORITHM: ${JWT_ALGORITHM:?}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_api:
        ipv4_address: 10.20.2.13
      private_back:
        ipv4_address: 10.20.3.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth-component:
        condition: service_healthy
      game-logic-component:
        condition: service_healthy
      profile-stats-component:
        condition: service_healthy
      tutor-component:
        condition: service_healthy
      single-player-component:
        condition: service_healthy

  api-gateway-component:
    <<: *service
    container_name: api-gateway-component
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    image: api-gateway-component:dev
    expose:
      - "8080"
    environment:
      PORT: "8080"
      AUTH_URL: http://auth-component:8081
      GAME_LOGIC_URL: http://game-logic-component:8082
      SINGLE_PLAYER_URL: http://single-player-component:8083
      MULTIPLAYER_URL: http://multiplayer-component:8084
      TUTOR_URL: http://tutor-component:8085
      BOTCITO_URL: http://botcito-component:8086
      PROFILE_URL: http://profile-stats-component:8087
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ALGORITHM: ${JWT_ALGORITHM:?}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
      COOKIE_SECURE: ${COOKIE_SECURE:?}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?}
      CORS_ORIGINS: https://localhost:${FRONTEND_HTTPS_PORT:?},https://127.0.0.1:${FRONTEND_HTTPS_PORT:?},http://localhost:${FRONTEND_PORT:?},http://localhost:5173,http://localhost:3000
    networks:
      private_api:
        ipv4_address: 10.20.2.14
      private_back:
        ipv4_address: 10.20.3.11
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      auth-component:
        condition: service_healthy
      profile-stats-component:
        condition: service_healthy
      single-player-component:
        condition: service_healthy
      multiplayer-component:
        condition: service_healthy
      tutor-component:
        condition: service_healthy
      game-logic-component:
        condition: service_healthy
      botcito-component:
        condition: service_healthy

  # =============================================================================================
  # BUSINESS LOGIC (PRIVATE SUBNETWORK 2 - 10.20.3.0/24)
  # =============================================================================================
  auth-component:
    <<: *service
    container_name: auth-component
    build:
      context: ./backend/auth-component
      dockerfile: Dockerfile
    image: auth-component:dev
    expose:
      - "8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.12
    healthcheck:
      # eclipse-temurin JRE image does not include curl or wget; bash checks HTTP 200 on /health.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  game-logic-component:
    <<: *service
    container_name: game-logic-component
    build:
      context: ./backend/GameLogic
      dockerfile: Dockerfile
    image: game-logic-component:dev
    expose:
      - "8082"
    environment:
      SERVER_PORT: "8082"
      MONGO_URL: mongodb://${MONGO_USER:?}:${MONGO_PASSWORD:?}@mongo:27017/${MONGO_DATABASE:?}?authSource=${MONGO_DATABASE:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      WAITING_TIMEOUT_MINUTES: ${WAITING_TIMEOUT_MINUTES:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.13
    healthcheck:
      # eclipse-temurin JRE image does not include curl or wget; bash opens the TCP socket directly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  single-player-component:
    <<: *service
    container_name: single-player-component
    build:
      context: ./backend/GameService
      dockerfile: Dockerfile
    image: single-player-component:dev
    expose:
      - "8083"
    environment:
      SERVER_PORT: "8083"
      GAME_LOGIC_URL: http://game-logic-component:8082
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
    networks:
      private_back:
        ipv4_address: 10.20.3.14
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      game-logic-component:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  multiplayer-component:
    <<: *service
    container_name: multiplayer-component
    build:
      context: ./backend/multiplayer-component
      dockerfile: Dockerfile
    image: multiplayer-component:dev
    expose:
      - "8084"
    environment:
      SERVER_PORT: "8084"
      PORT: "8084"
      GAME_LOGIC_URL: http://game-logic-component:8082
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      RECONNECT_WINDOW_SECONDS: ${RECONNECT_WINDOW_SECONDS:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.15
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8084 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      game-logic-component:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tutor-component:
    <<: *service
    container_name: tutor-component
    build:
      context: ./backend/tutor-component
      dockerfile: Dockerfile
    image: tutor-component:dev
    expose:
      - "8085"
    environment:
      PORT: "8085"
      MONGO_ANALYSIS_URL: mongodb://${MONGO_ANALYSIS_USER:?}:${MONGO_ANALYSIS_PASSWORD:?}@mongo-analysis:27017/${MONGO_ANALYSIS_DATABASE:?}?authSource=${MONGO_ANALYSIS_DATABASE:?}
      MONGO_ANALYSIS_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      ENGINE_VERSION: ${ENGINE_VERSION:?}
      ANALYSIS_DEPTH_DEFAULT: ${ANALYSIS_DEPTH_DEFAULT:?}
      ANALYSIS_DEPTH_MAX: ${ANALYSIS_DEPTH_MAX:?}
      ANALYSIS_MAX_REACTIVATIONS: ${ANALYSIS_MAX_REACTIVATIONS:?}
      LLM_PROVIDER: ${LLM_PROVIDER:?}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.16
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mongo-analysis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  botcito-component:
    <<: *service
    container_name: botcito-component
    build:
      context: ./backend/botcito-component
      dockerfile: Dockerfile
    image: botcito-component:dev
    expose:
      - "8086"
    environment:
      PORT: "8086"
      ENGINE_ROLE: game
      STOCKFISH_PATH: /usr/games/stockfish
      ENGINE_POOL_SIZE: "2"
      ENGINE_THREADS: "1"
      ENGINE_TIMEOUT_MS: "2000"
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.17
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  botcito-analysis-component:
    <<: *service
    container_name: botcito-analysis-component
    build:
      context: ./backend/botcito-component
      dockerfile: Dockerfile
    image: botcito-analysis-component:dev
    expose:
      - "8091"
    environment:
      PORT: "8091"
      ENGINE_ROLE: analysis
      STOCKFISH_PATH: /usr/games/stockfish
      ENGINE_POOL_SIZE: "2"
      ENGINE_THREADS: "1"
      ENGINE_TIMEOUT_MS: "10000"
      ANALYSIS_DEPTH_MAX: ${ANALYSIS_DEPTH_MAX:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.18
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  profile-stats-component:
    <<: *service
    container_name: profile-stats-component
    build:
      context: ./backend/profile-stats-component
      dockerfile: Dockerfile
    image: profile-stats-component:dev
    expose:
      - "8087"
    environment:
      SERVER_PORT: "8087"
      POSTGRES_URL: jdbc:postgresql://postgres-profile:5432/${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
    networks:
      private_back:
        ipv4_address: 10.20.3.19
    healthcheck:
      # eclipse-temurin JRE image does not include curl or wget; bash opens the TCP socket directly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres-profile:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # =============================================================================================
  # WORKERS (PRIVATE SUBNETWORK 2 - 10.20.3.0/24)
  # =============================================================================================
  timeout-worker:
    <<: *service
    container_name: timeout-worker
    build:
      context: ./backend/timeout-worker
      dockerfile: Dockerfile
    image: timeout-worker:dev
    expose:
      - "8088"
    environment:
      PORT: "8088"
      GAME_LOGIC_URL: http://game-logic-component:8082
      TIMEOUT_POLL_INTERVAL_SECONDS: ${TIMEOUT_POLL_INTERVAL_SECONDS:?}
      TIMEOUT_BATCH_LIMIT: ${TIMEOUT_BATCH_LIMIT:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.20
    healthcheck:
      test: ["CMD", "/app/timeout-worker", "-health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      game-logic-component:
        condition: service_healthy

  analysis-worker:
    <<: *service
    container_name: analysis-worker
    build:
      context: ./backend/analysis-worker
      dockerfile: Dockerfile
    image: analysis-worker:dev
    expose:
      - "8089"
    environment:
      PORT: "8089"
      GAME_LOGIC_URL: http://game-logic-component:8082
      BOTCITO_ANALYSIS_URL: http://botcito-analysis-component:8091
      MONGO_ANALYSIS_URL: mongodb://${MONGO_ANALYSIS_USER:?}:${MONGO_ANALYSIS_PASSWORD:?}@mongo-analysis:27017/${MONGO_ANALYSIS_DATABASE:?}?authSource=${MONGO_ANALYSIS_DATABASE:?}
      MONGO_ANALYSIS_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672
      ANALYSIS_DEPTH_MAX: ${ANALYSIS_DEPTH_MAX:?}
      ANALYSIS_MAX_RETRIES: ${ANALYSIS_MAX_RETRIES:?}
      ANALYSIS_INACCURACY_CP: ${ANALYSIS_INACCURACY_CP:?}
      ANALYSIS_MISTAKE_CP: ${ANALYSIS_MISTAKE_CP:?}
      ANALYSIS_BLUNDER_CP: ${ANALYSIS_BLUNDER_CP:?}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:?}
      ANALYSIS_STALE_MINUTES: ${ANALYSIS_STALE_MINUTES:?}
      LOG_LEVEL: ${LOG_LEVEL:?}
    networks:
      private_back:
        ipv4_address: 10.20.3.21
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      game-logic-component:
        condition: service_healthy
      botcito-analysis-component:
        condition: service_healthy
      mongo-analysis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # =============================================================================================
  # BROKER AND DATABASES (PRIVATE SUBNETWORK 2 - 10.20.3.0/24)
  # =============================================================================================
  rabbitmq:
    <<: *service
    image: rabbitmq:3.13-management
    container_name: rabbitmq-broker
    # Fixed hostname: RabbitMQ stores node state in a directory derived from the node name.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      private_back:
        ipv4_address: 10.20.3.22
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  mongo:
    <<: *service
    image: mongo:7
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?}
      MONGO_APP_DATABASE: ${MONGO_DATABASE:?}
      MONGO_APP_USERNAME: ${MONGO_USER:?}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
      - type: bind
        source: ./database/mongo/init-mongo.sh
        target: /docker-entrypoint-initdb.d/init-mongo.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      private_back:
        ipv4_address: 10.20.3.23
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo-analysis:
    <<: *service
    image: mongo:7
    container_name: mongo-analysis-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      MONGO_APP_DATABASE: ${MONGO_ANALYSIS_DATABASE:?}
      MONGO_APP_USERNAME: ${MONGO_ANALYSIS_USER:?}
      MONGO_APP_PASSWORD: ${MONGO_ANALYSIS_PASSWORD:?}
    expose:
      - "27017"
    volumes:
      - mongo-analysis-data:/data/db
      - type: bind
        source: ./database/mongo/init-mongo.sh
        target: /docker-entrypoint-initdb.d/init-mongo.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      private_back:
        ipv4_address: 10.20.3.24
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    <<: *service
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./database/auth/01-init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      private_back:
        ipv4_address: 10.20.3.25
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-profile:
    <<: *service
    image: postgres:16-alpine
    container_name: postgres-profile-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./database/profile/01-init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      private_back:
        ipv4_address: 10.20.3.26
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  public_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.1.0/24
          gateway: 10.20.1.1
  private_api:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.2.0/24
          gateway: 10.20.2.1
  private_back:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.3.0/24
          gateway: 10.20.3.1

volumes:
  mongo-data:
  mongo-analysis-data:
  mysql-data:
  postgres-data:
  rabbitmq-data:
