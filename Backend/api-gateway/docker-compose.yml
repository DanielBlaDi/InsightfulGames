services:
  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      USE_MOCK: "True"
      AUTH_SERVICE_URL: "http://auth-component:8081"
      GAME_SERVICE_URL: "http://game-service:8083"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
