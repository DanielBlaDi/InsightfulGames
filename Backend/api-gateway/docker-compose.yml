services:
  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      AUTH_URL: http://auth-component:8081
      SINGLE_PLAYER_URL: http://single-player-component:8083
      BOTCITO_URL: http://botcito-component:8086
      HTTP_TIMEOUT: 15
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
