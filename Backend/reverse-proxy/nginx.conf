# Proxy inverso de Insightful Games (Reverse Proxy Pattern).
#
# Es el ÚNICO servicio que publica puertos al exterior. Atiende dos clientes con dos entradas:
#
#   :8000 (FRONTEND_PORT)       navegador   /            -> frontend-component:80   (Express + Vike)
#                                           /api/*       -> api-gateway-component:8080 (sin /api)
#                                           /api/ws/*    -> api-gateway-component:8080 (WebSocket)
#   :8090 (MOBILE_GATEWAY_PORT) app Android /*           -> api-gateway-mobile:8090
#
# En ambas entradas /internal/* y /api/internal/* se responden 404 aquí, sin llegar a ningún gateway.
# Los gateways ya no exponen ninguna ruta /internal (ningún servicio los llama); el bloqueo se
# mantiene como defensa en profundidad.
#
# Los destinos se resuelven con el DNS de Docker en cada petición (variable + resolver), así el
# proxy sigue funcionando si un contenedor se recrea y cambia de IP, y arranca aunque un
# destino aún no esté listo.

resolver 127.0.0.11 valid=10s ipv6=off;

# Oculta la versión de Nginx en cabeceras y páginas de error.
server_tokens off;

# Un WebSocket mantiene "Connection: upgrade"; una petición normal no (permite keep-alive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Freno de fuerza bruta en registro/login: 10 peticiones/s por IP con ráfaga de 20.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------------------------
# Entrada WEB
# ---------------------------------------------------------------------------------------------
server {
    listen 8000;
    server_name _;

    # Los cuerpos reales son JSON pequeños.
    client_max_body_size 1m;

    # Cada location que reenvía repite sus proxy_set_header: en Nginx, definir uno solo en un
    # location anula los heredados del server. X-User-Id "" corta en el borde la cabecera que
    # el gateway pone tras validar el JWT (el gateway también la descarta).

    # Salud del propio proxy (no depende de los destinos).
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # /api/internal/* nunca llega al gateway. Nginx compara la ruta ya normalizada (decodificada,
    # sin barras repetidas ni "..") y sin distinguir mayúsculas, así que /API/Internal,
    # /api//internal o /api/%69nternal también caen aquí. Una expresión regular gana a los
    # prefijos /api/ y /api/ws/ de abajo.
    location ~* ^/api/internal(/|$) {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Ruta inexistente"}}';
    }

    # WebSocket del ajedrez: /api/ws/* -> gateway /ws/* . Origin y Cookie pasan tal cual;
    # el gateway valida Origin contra WS_ALLOWED_ORIGINS y la sesión.
    location /api/ws/ {
        set $web_gateway http://api-gateway-component:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $web_gateway;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-User-Id  "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Registro y login: mismo destino que /api/, con límite de frecuencia.
    location ~ ^/api/auth/(login|register)/?$ {
        limit_req zone=auth_zone burst=20 nodelay;

        set $web_gateway http://api-gateway-component:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $web_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 65s;
    }

    # REST: /api/* -> gateway /* . Set-Cookie, Cookie e Idempotency-Key pasan sin tocar.
    # 65 s cubre DELETE /auth/account (4 x HTTP_TIMEOUT), igual que el proxy anterior del frontend.
    location /api/ {
        set $web_gateway http://api-gateway-component:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $web_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 65s;
    }

    # Todo lo demás: páginas y estáticos del frontend.
    location / {
        set $web_frontend http://frontend-component:80;
        proxy_pass $web_frontend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------------------------
# Entrada MÓVIL (la app Android usa BASE_URL = raíz de este servidor, sin prefijo)
# ---------------------------------------------------------------------------------------------
server {
    listen 8090;
    server_name _;

    client_max_body_size 1m;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # El gateway móvil solo habla con /internal/* hacia dentro; desde fuera no existe.
    location ~* ^/internal(/|$) {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Ruta inexistente"}}';
    }

    location ~ ^/auth/(login|register)/?$ {
        limit_req zone=auth_zone burst=20 nodelay;

        set $mobile_gateway http://api-gateway-mobile:8090;
        proxy_pass $mobile_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $mobile_gateway http://api-gateway-mobile:8090;
        proxy_pass $mobile_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 65 s, como la entrada web: DELETE /auth/account (saga) puede tardar hasta 4 x HTTP_TIMEOUT.
        proxy_read_timeout 65s;
    }
}
