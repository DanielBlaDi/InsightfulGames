# Configuración común de los dos reverse proxy (Reverse Proxy Pattern). Contexto http de Nginx.
#
# Cada entrada es un contenedor propio, construido con la misma imagen y ENTRY distinto (ver Dockerfile):
#
#   reverse-proxy-web     (ENTRY=web,    conf web.conf)    :8000  navegador  -> frontend + api-gateway-component
#   reverse-proxy-mobile  (ENTRY=mobile, conf mobile.conf) :8090  app Android -> api-gateway-mobile
#
# Los dos están en public_network (lo único publicado) y en private_api, donde solo ven al frontend y a los
# gateways: ningún proxy alcanza Auth, Game Logic ni las bases de datos (están en private_back).
#
# Los destinos se resuelven con el DNS de Docker en cada petición (variable + resolver), así el proxy sigue
# funcionando si un contenedor se recrea y cambia de IP, y arranca aunque un destino aún no esté listo.

resolver 127.0.0.11 valid=10s ipv6=off;

# Oculta la versión de Nginx en cabeceras y páginas de error.
server_tokens off;

# Un WebSocket mantiene "Connection: upgrade"; una petición normal no (permite keep-alive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Freno de fuerza bruta en registro/login: 10 peticiones/s por IP con ráfaga de 20. Cada contenedor tiene su
# propia zona, así que la web y la app llevan cupos separados.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------------------------------------
# Secure Channel Pattern (Prototype 3, escenario 1): política TLS común de las dos entradas.
# El canal cifrado va del cliente (navegador / app Android) a este proxy; detrás, el tráfico sigue por las
# redes Docker internas (private_api, private_back). Ver docs/secure-channel-tls.md.
#
# Solo TLS 1.2 y 1.3 (SSLv3, TLS 1.0 y 1.1 quedan rechazados). Cifrados del perfil "intermediate" de
# Mozilla para TLS 1.2: todos con secreto perfecto hacia adelante (ECDHE) y AEAD (GCM / ChaCha20).
# En TLS 1.3 OpenSSL usa siempre sus suites seguras por defecto.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
# Sin tickets de sesión: evitan que una clave de ticket comprometida descifre sesiones pasadas.
ssl_session_tickets off;
