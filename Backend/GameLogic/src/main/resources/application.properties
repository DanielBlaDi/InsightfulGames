spring.application.name=chess
server.port=8082
# Contrato (sección 7): MONGO_URL = mongodb://mongo-component:27017/games
# Boot 4 usa spring.mongodb.*; se deja también el nombre anterior por compatibilidad.
# MONGODB_URI se acepta como nombre antiguo.
spring.mongodb.uri=${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/games}}
spring.data.mongodb.uri=${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/games}}
