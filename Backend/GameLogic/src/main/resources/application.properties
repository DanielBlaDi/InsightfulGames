spring.application.name=chess
server.port=${SERVER_PORT:8082}

# Contrato, 11.5: MONGO_URL. Boot 4 usa spring.mongodb.*; se deja también el nombre anterior.
spring.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/games}
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/games}
spring.data.mongodb.auto-index-creation=true

# Contrato, 11.5 y 19.8: RABBITMQ_URL (amqp://usuario:clave@rabbitmq:5672).
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Contrato, 11.5: plazo de una partida multijugador en waiting.
game.waiting-timeout-minutes=${WAITING_TIMEOUT_MINUTES:2}
