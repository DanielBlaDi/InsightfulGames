spring.application.name=chess
server.port=8082
-spring.mongodb.uri=${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/games}}
-spring.data.mongodb.uri=${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/games}}
-spring.data.mongodb.auto-index-creation=true
spring.rabbitmq.addresses=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true