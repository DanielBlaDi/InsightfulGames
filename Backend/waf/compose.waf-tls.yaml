# =============================================================================================
# Secure Channel (Prototype 3, scenario 1) on top of the WAF (Backend/waf/compose.waf.yaml).
# Third Compose layer; it does not modify compose.yaml nor Kevin's compose.waf.yaml:
#
#   docker compose -f compose.yaml -f Backend/waf/compose.waf.yaml -f Backend/waf/compose.waf-tls.yaml up --build -d
#
#   Browser ==TLS (edge cert, mkcert CA)==> waf-web:8443 ==TLS (internal CA, name verified)==> reverse-proxy-web:8443
#   Android ==TLS (edge cert, mkcert CA)==> waf-mobile:8443 ==TLS (internal CA, name verified)==> reverse-proxy-mobile:8443
#   reverse proxies -> frontend / gateways: HTTP inside private_api (outside the scope of scenario 1)
#
# Variables used by owasp/modsecurity-crs:nginx were checked against the image sources
# (coreruleset/modsecurity-crs-docker: nginx/Dockerfile, templates/includes/proxy_backend_ssl.conf.template,
# docker-entrypoint.d/93-update-proxy-ssl-config.sh, src/bin/check-proxy-client-cert). With PROXY_SSL=on
# and no client certificate at the default paths the image includes proxy_backend_ssl.conf without mTLS
# ("no-cert"), so upstream verification works without a client certificate.
# Networks, subnets and IPs are not changed (waf-edge, public_network, private_api, private_back).
# =============================================================================================

x-edge-tls-env: &edge-tls-env
  # Client -> WAF (TLS terminated here so ModSecurity/CRS can inspect the HTTP request)
  SSL_PORT: "8443"
  SSL_CERT_FILE: /etc/nginx/edge-certs/tls.crt
  SSL_CERT_KEY_FILE: /etc/nginx/edge-certs/tls.key
  SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
  # Same ECDHE + AEAD list as Backend/reverse-proxy/nginx/common.conf (the image default also allows DHE)
  SSL_CIPHERS: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
  # Development certificates have no OCSP responder; stapling would only log warnings.
  SSL_OCSP_STAPLING: "off"
  # Plain HTTP is never proxied: every request on PORT gets a 301 to HTTPS before reaching ModSecurity
  # or the reverse proxy (only /.well-known/acme-challenge/ is exempt, by the image).
  NGINX_ALWAYS_TLS_REDIRECT: "on"
  # WAF -> reverse proxy: new TLS connection, certificate chain AND name verified
  PROXY_SSL: "on"
  PROXY_SSL_VERIFY: "on"
  PROXY_SSL_VERIFY_DEPTH: "1"          # leaf signed directly by the internal CA
  PROXY_SSL_SERVER_NAME: "on"          # SNI; the name checked is the host of BACKEND
  PROXY_SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
  PROXY_SSL_CIPHERS: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
  PROXY_SSL_CA_CERT_FILE: /etc/nginx/upstream-ca/ca.crt   # ONLY the internal CA (not the system store)

x-edge-cert: &edge-cert
  type: bind
  source: ${EDGE_TLS_DIR:?}                  # tls.crt + tls.key (mkcert: localhost, 127.0.0.1, ::1, 10.0.2.2)
  target: /etc/nginx/edge-certs
  read_only: true
  bind:
    create_host_path: false

x-internal-ca: &internal-ca
  type: bind
  source: ${INTERNAL_CA_CERT:?}              # certs/internal/ca/ca.crt (public certificate only, never ca.key)
  target: /etc/nginx/upstream-ca/ca.crt
  read_only: true
  bind:
    create_host_path: false

services:
  # Reverse proxies: same image and nginx config as scenario 1/2; only the certificate changes to the
  # internal one (SAN = service name). Kevin's file already removes their published ports.
  reverse-proxy-web:
    volumes:
      - type: bind
        source: ${INTERNAL_WEB_TLS_DIR:?}    # certs/internal/reverse-proxy-web
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false

  reverse-proxy-mobile:
    volumes:
      - type: bind
        source: ${INTERNAL_MOBILE_TLS_DIR:?} # certs/internal/reverse-proxy-mobile
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false

  waf-web:
    environment:
      <<: *edge-tls-env
      BACKEND: "https://reverse-proxy-web:8443"
      SSL_REDIRECT_PORT: ${FRONTEND_HTTPS_PORT:?}    # public HTTPS port used in the 301
    ports: !override
      - "${FRONTEND_PORT:?}:8080"          # HTTP: only 301 to HTTPS
      - "${FRONTEND_HTTPS_PORT:?}:8443"    # HTTPS + WSS
    volumes:
      - *edge-cert
      - *internal-ca
    depends_on:
      reverse-proxy-web:
        condition: service_healthy

  waf-mobile:
    environment:
      <<: *edge-tls-env
      BACKEND: "https://reverse-proxy-mobile:8443"
      SSL_REDIRECT_PORT: ${MOBILE_HTTPS_PORT:?}
    ports: !override
      - "${MOBILE_HTTPS_PORT:?}:8443"      # HTTPS only: mobile HTTP is not published
    volumes:
      - *edge-cert
      - *internal-ca
    depends_on:
      reverse-proxy-mobile:
        condition: service_healthy
