spring.application.name=timeout-worker

# Contrato, 18.5. Sin valores por defecto: si falta una variable, el servicio no arranca
# (y el healthcheck falla) en lugar de trabajar con una configuración inventada.
server.port=${PORT}
worker.gateway-internal-url=${GATEWAY_INTERNAL_URL}
worker.poll-interval-seconds=${TIMEOUT_POLL_INTERVAL_SECONDS}
worker.batch-limit=${TIMEOUT_BATCH_LIMIT}

logging.level.root=${LOG_LEVEL:INFO}
