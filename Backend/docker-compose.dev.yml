# Solo para probar el backend en local. El compose oficial lo mantiene Infra (tarea 1).
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  game-logic:
    build: ./GameLogic
    environment:
      MONGODB_URI: mongodb://mongo:27017/chess
    depends_on:
      - mongo
    ports:
      - "8082:8082"

  game-service:
    build: ./GameService
    environment:
      GAMELOGIC_URL: http://game-logic:8082
      BOTCITO_URL: http://botcito:8086
    depends_on:
      game-logic:
        condition: service_started
      botcito:
        condition: service_healthy
    ports:
      - "8083:8083"

  botcito:
    build: ./botcito-component
    ports:
      - "8086:8086"
