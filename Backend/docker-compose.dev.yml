# Solo para probar el backend en local. El compose oficial lo mantiene Infra (tarea 1).
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  game-logic:
    build: ./GameLogic
    environment:
      MONGODB_URI: mongodb://mongo:27017/chess
    depends_on:
      - mongo
    ports:
      - "8082:8082"

  single-player-component:
    build: ./GameService
    environment:
      GAME_LOGIC_URL: http://game-logic-component:8082
      # El modo vs_bot llama a {GATEWAY_INTERNAL_URL}/engine/best-move.
      # Aquí apunta al Botcito falso que corre en tu máquina (GameService/tools/fake_botcito.py, puerto 8000).
      GATEWAY_INTERNAL_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway" # necesario en Linux; en Windows y Mac ya existe
    depends_on:
      - game-logic
    ports:
      - "8083:8083"