# Solo para probar el backend en local. El compose oficial lo mantiene Infra (tarea 1).
# Los nombres de servicio siguen el contrato (sección 2).
services:
  mongo-component:
    image: mongo:7
    ports:
      - "27017:27017"

  game-logic-component:
    build: ./GameLogic
    environment:
      MONGO_URL: mongodb://mongo-component:27017/games
    depends_on:
      - mongo-component
    ports:
      - "8082:8082"

  single-player-component:
    build: ./GameService
    environment:
      GAME_LOGIC_URL: http://game-logic-component:8082
      # Single Player ya no llama a Botcito: el turno del bot lo orquesta el gateway web (BOTCITO_URL allí).
    extra_hosts:
      - "host.docker.internal:host-gateway" # necesario en Linux; en Windows y Mac ya existe
    depends_on:
      game-logic:
        condition: service_started
      botcito:
        condition: service_healthy
    ports:
      - "8083:8083"

  botcito:
    build: ./botcito-component
    ports:
      - "8086:8086"