server:
  port: 8081

spring:
  application:
    name: auth-component

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    # amqp://usuario:clave@rabbitmq:5672 (contrato v9, sección 21)
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

# Borrado de cuenta: Auth llama a Game Logic, Tutor y Profile/Stats por el gateway interno.
gateway:
  internal-url: ${GATEWAY_INTERNAL_URL:http://localhost:8080}
  timeout-seconds: ${HTTP_TIMEOUT:15}
