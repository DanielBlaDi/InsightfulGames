# Override SOLO para depuración local: vuelve a publicar en 127.0.0.1 los puertos internos que
# el compose base ya no expone, para probar cada servicio con curl saltándose el proxy inverso.
# No lo uses en un despliegue: abre caminos que evitan el proxy.
#
# Docker no publica puertos de un contenedor que solo está en redes `internal` (private_api y private_back),
# así que cada servicio depurado se conecta además a public_network. Eso rompe el aislamiento de la red:
# solo para depurar en local.
#
#   docker compose -f compose.yaml -f compose.debug.yaml up -d --build
services:
  api-gateway-component:
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      public_network: {}
  auth-component:
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      public_network: {}
  game-logic-component:
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      public_network: {}
  single-player-component:
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      public_network: {}
  multiplayer-component:
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      public_network: {}
  tutor-component:
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      public_network: {}
  botcito-component:
    ports:
      - "127.0.0.1:8086:8086"
    networks:
      public_network: {}
  api-gateway-mobile:
    ports:
      - "127.0.0.1:8091:8090"
    networks:
      public_network: {}
